services:
  rustdesk:
    image: ${RUSTDESK_SERVER_IMAGE:-ghcr.io/hsos6miyabi/rustdesk-server:latest}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      RELAY: ${RUSTDESK_RELAY_HOST:-desk.example.com}
      ENCRYPTED_ONLY: "1"
      MUST_LOGIN: ${MUST_LOGIN:-N}
      RUSTDESK_API_RUSTDESK_ID_SERVER: ${RUSTDESK_ID_HOST:-desk.example.com:21116}
      RUSTDESK_API_RUSTDESK_RELAY_SERVER: ${RUSTDESK_RELAY_SERVER:-desk.example.com:21117}
      RUSTDESK_API_RUSTDESK_API_SERVER: ${RUSTDESK_API_URL:-https://api.example.com}
      RUSTDESK_API_RUSTDESK_KEY_FILE: /data/id_ed25519.pub
      RUSTDESK_API_JWT_KEY: ${RUSTDESK_API_JWT_KEY:?Set RUSTDESK_API_JWT_KEY before starting}
    ports:
      - "21114:21114"
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21117:21117"
      - "21118:21118"
      - "21119:21119"
    volumes:
      - ./data/server:/data
      - ./data/api:/app/data
