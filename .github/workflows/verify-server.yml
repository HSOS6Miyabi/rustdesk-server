name: Verify RustDesk Server
on:
  push:
    branches:
      - maintenance/upstream-2026-11
      - forapi
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsodium-dev libsqlite3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify Rust code
        run: cargo test --lib --tests
      - name: Compile executables
        run: cargo build --bins
      - name: Check live rendezvous and relay services
        run: python3 scripts/test_runtime.py target/debug/hbbs target/debug/hbbr
      - name: Check that server administration changes survive process restarts
        run: python3 scripts/test_persisted_settings.py target/debug/hbbs
      - name: Check managed registration with a running hbbs process
        run: python3 scripts/test_device_deployment.py target/debug/hbbs
      - name: Check live relay preferences with a running hbbs process
        run: python3 scripts/test_managed_relays.py target/debug/hbbs
      - name: Check native control permissions using a running hbbs process
        run: python3 scripts/test_control_roles.py target/debug/hbbs
      - name: Check optional connection access with a running hbbs process
        run: python3 scripts/test_connection_access.py target/debug/hbbs
      - name: Check deployment, JWT login, access rules and control roles together
        run: python3 scripts/test_strict_combination.py target/debug/hbbs
