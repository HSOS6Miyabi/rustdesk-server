name: Publish approved RustDesk Server version

on:
  push:
    branches:
      - forapi
    paths:
      - .release-version
  pull_request:
    paths:
      - '.github/workflows/publish-approved-milestone.yml'
      - '.release-version'

permissions:
  contents: write
  actions: write

concurrency:
  group: rustdesk-server-approved-version
  cancel-in-progress: false

jobs:
  dispatch-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read the approved version number
        id: version
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="$(tr -d '\r\n' < .release-version)"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-api\.[0-9]+$ ]]; then
            echo "Invalid server release version" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Create the release tag
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null)"; then
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              echo "The release tag already points to another commit" >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" > /dev/null
          fi
      - name: Publish release archives and Docker images
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release-server.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG" --field milestone_release=true
