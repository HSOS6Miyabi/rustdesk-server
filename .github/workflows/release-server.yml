name: Release RustDesk Server

on:
  push:
    branches:
      - forapi
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libsodium-dev libssl-dev libsqlite3-dev
      - name: Test server
        run: cargo test --lib --tests
      - name: Compile executable programs
        run: cargo build --bins
      - name: Check live TCP, WebSocket and UDP services
        run: python3 scripts/test_runtime.py target/debug/hbbs target/debug/hbbr

  binaries:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
            s6arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            s6arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libsodium-dev libssl-dev libsqlite3-dev
      - name: Compile release programs
        run: cargo build --release --bins
      - name: Prepare release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          install -m755 target/release/hbbs dist/package/hbbs
          install -m755 target/release/hbbr dist/package/hbbr
          install -m755 target/release/rustdesk-utils dist/package/rustdesk-utils
          cp LICENSE dist/package/
          tar -czf dist/rustdesk-server-linux-${{ matrix.arch }}.tar.gz -C dist/package .
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.arch }}
          path: dist/rustdesk-server-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          merge-multiple: true
          path: dist/
      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.1.17-api.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          files: dist/rustdesk-server-linux-*.tar.gz

  container:
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
            s6arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            s6arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: server-${{ matrix.arch }}
          path: docker/
      - name: Extract executables
        shell: bash
        run: |
          mkdir -p docker/rootfs/usr/bin
          tar -xzf docker/rustdesk-server-linux-${{ matrix.arch }}.tar.gz -C docker/rootfs/usr/bin ./hbbs ./hbbr ./rustdesk-utils
          chmod +x docker/rootfs/usr/bin/hbbs docker/rootfs/usr/bin/hbbr docker/rootfs/usr/bin/rustdesk-utils
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image name and version
        id: vars
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.1.17-api.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: ${{ matrix.platform }}
          build-args: |
            S6_ARCH=${{ matrix.s6arch }}
            API_IMAGE_TAG=v3.0.0-api.95
          push: true
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}-${{ matrix.arch }}
      - name: Run API and RustDesk container integration test
        run: python3 scripts/test_container_image.py "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}-${{ matrix.arch }}"

  manifest:
    needs: container
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-platform image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v1.1.17-api.$GITHUB_RUN_NUMBER"
          fi
          TAGS=(-t "$IMAGE:$TAG")
          if [[ "$GITHUB_REF" == "refs/heads/forapi" ]]; then
            TAGS+=(-t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${TAGS[@]}" \
            "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$TAG"
